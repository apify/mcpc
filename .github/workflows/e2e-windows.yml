name: E2E Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  e2e-windows-node:
    name: E2E tests (Windows, Node.js)
    runs-on: windows-latest
    # Backstop against a hung test stalling the job until GitHub's 6h hard kill.
    # The per-test watchdog in run.sh is the primary guard; this is the safety net.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm and dependencies
        uses: apify/actions/pnpm-install@v1.1.2

      - name: Build
        run: pnpm run build

      - name: E2E tests
        # windows-latest runners have 4 vCPUs, so run 4 tests at a time (same as
        # macOS). Process spawning is far more expensive on Windows than on Linux
        # and the suite is spawn-bound, so it was previously run sequentially and
        # took ~21 min — by far the slowest job in CI.
        env:
          # Individual tests slow down under parallel contention; the watchdog only
          # needs to catch genuine hangs, so give it headroom over the 180s default.
          E2E_PER_TEST_TIMEOUT: 300
        run: ./test/e2e/run.sh --no-build --parallel 4

  e2e-windows-bun:
    name: E2E tests (Windows, Bun)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm and dependencies
        uses: apify/actions/pnpm-install@v1.1.2

      - name: Build
        run: pnpm run build

      - name: E2E tests
        env:
          E2E_PER_TEST_TIMEOUT: 300
        run: ./test/e2e/run.sh --no-build --runtime bun --parallel 4
